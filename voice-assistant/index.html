<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Microsoft YaHei', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      color: white;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .status {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff6b6b;
    }
    
    .status-dot.active {
      background: #51cf66;
    }
    
    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
    }
    
    .left-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      color: white;
      display: flex;
      flex-direction: column;
    }
    
    .right-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 20px;
      color: white;
      display: flex;
      flex-direction: column;
    }
    
    .panel-title {
      font-size: 18px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.3);
    }
    
    .log-container {
      flex: 1;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    
    .log-item {
      margin-bottom: 8px;
      padding: 5px;
      border-radius: 5px;
    }
    
    .log-item.info {
      background: rgba(33, 150, 243, 0.2);
    }
    
    .log-item.success {
      background: rgba(76, 175, 80, 0.2);
    }
    
    .log-item.error {
      background: rgba(244, 67, 54, 0.2);
    }
    
    .log-time {
      color: rgba(255, 255, 255, 0.6);
      margin-right: 10px;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .voice-visualizer {
      height: 100px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .wave-container {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 60px;
    }
    
    .wave-bar {
      width: 4px;
      background: linear-gradient(to top, #667eea, #764ba2);
      border-radius: 2px;
      transition: height 0.1s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎤 语音助手控制台</h1>
      <div class="status">
        <div class="status-item">
          <div class="status-dot" id="wsStatus"></div>
          <span>WebSocket: <span id="wsStatusText">未连接</span></span>
        </div>
        <div class="status-item">
          <div class="status-dot" id="micStatus"></div>
          <span>麦克风: <span id="micStatusText">未启动</span></span>
        </div>
        <div class="status-item">
          <div class="status-dot" id="voskStatus"></div>
          <span>Vosk: <span id="voskStatusText">未加载</span></span>
        </div>
      </div>
    </div>
    
    <div class="main-content">
      <div class="left-panel">
        <div class="panel-title">📝 日志输出</div>
        <div class="log-container" id="logContainer"></div>
      </div>
      
      <div class="right-panel">
        <div class="panel-title">🎙️ 语音识别</div>
        <div class="voice-visualizer">
          <div class="wave-container" id="waveContainer"></div>
        </div>
        <div class="controls">
          <button class="btn btn-primary" id="startBtn" onclick="startListening()">
            开始识别
          </button>
          <button class="btn btn-danger" id="stopBtn" onclick="stopListening()" disabled>
            停止识别
          </button>
        </div>
        <div style="margin-top: 15px;">
          <div style="font-size: 14px; margin-bottom: 8px;">识别结果:</div>
          <div id="resultText" style="background: rgba(0, 0, 0, 0.2); padding: 15px; border-radius: 8px; min-height: 60px;">
            等待语音输入...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
